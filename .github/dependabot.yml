# Meldet neue Fassungen der verwendeten Pakete als Pull Request.
#
# Der Grund: Die Anwendung wird in Schüben gebaut, mit Wochen dazwischen.
# Ohne Erinnerung veraltet sie still — und je länger niemand aktualisiert,
# desto größer wird der Sprung, den irgendwann jemand auf einmal machen muss.
#
# Wöchentlich und gebündelt, damit nicht für jedes Paket eine eigene Meldung
# entsteht. Zusammengeführt wird nichts von allein: Jeder Vorschlag muss die
# Prüfungen aus pages.yml bestehen und von Hand übernommen werden.

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      # Alles, was nur beim Bauen und Prüfen gebraucht wird, in einem
      # Vorschlag. Diese Pakete landen nicht in der ausgelieferten Anwendung.
      werkzeuge:
        patterns: ['*']
        update-types: [minor, patch]
    ignore:
      # Große Sprünge bleiben Handarbeit: Sie brauchen einen Blick in die
      # Änderungshinweise und oft eigene Anpassungen. Als automatischer
      # Vorschlag stünden sie nur im Weg — TypeScript 7 etwa wurde bewusst
      # zurückgestellt.
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'Pakete'
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]
    commit-message:
      prefix: 'Abläufe'
