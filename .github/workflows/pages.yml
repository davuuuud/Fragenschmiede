# Baut die Anwendung und veröffentlicht sie auf GitHub Pages.
#
# Einmalige Einrichtung im Browser:
#   Repository -> Settings -> Pages -> Source: "GitHub Actions"
#
# Danach genügt ein Push auf main; die Adresse lautet
#   https://<konto>.github.io/<repository>/

name: Auf GitHub Pages veröffentlichen

on:
  push:
    branches: [main]
  # Erlaubt das Auslösen von Hand über den Reiter "Actions".
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Nur eine Veröffentlichung gleichzeitig; laufende werden nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Die Prüfungen laufen mit: Eine fehlerhafte Fassung soll gar nicht
      # erst online gehen.
      - name: Tests
        run: npm test

      - name: Typprüfung
        run: npm run check

      # GitHub Pages liefert das Projekt unter /<repository>/ aus, nicht im
      # Wurzelverzeichnis. Ohne den passenden Basispfad fänden die Seite
      # ihre eigenen Dateien nicht.
      - name: Bauen
        run: npm run build -- --base=/${{ github.event.repository.name }}/

      # Die Anwendung verspricht, nichts zu übertragen. Die Prüfung liest
      # den gebauten Code und bricht ab, sobald darin ein Netzwerkaufruf
      # oder eine unbekannte fremde Adresse steht — deshalb hinter dem
      # Bauen und vor dem Veröffentlichen.
      - name: Netzprüfung
        run: npm run pruefe:netz

      # Alles, was die Anwendung kann, muss für den Offline-Betrieb vorab
      # auf das Gerät. Der Wächter meldet unbemerktes Wachsen.
      - name: Größe
        run: npm run pruefe:groesse

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
