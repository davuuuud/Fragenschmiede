<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta
      name="description"
      content="{{META_BESCHREIBUNG}}"
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f7f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#14171c" media="(prefers-color-scheme: dark)" />

    <!-- Startbildschirm unter iOS. Android liest diese Angaben aus dem
         Web-Manifest, das das PWA-Plugin einhängt. -->
    <link rel="apple-touch-icon" href="apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="{{APP_NAME}}" />
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Name und Beschreibung setzt vite.config.ts aus dem Profil ein
         (src/lib/profile/<profil>/marke.ts). -->
    <title>{{APP_NAME}}</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
