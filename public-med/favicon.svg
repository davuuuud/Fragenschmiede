<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- App-Symbol der Fragenschmiede Med: dieselbe Form wie das der
       Fragenschmiede — Kachel, Blatt, Eingabepfeil, Textzeilen —, damit die
       Verwandtschaft erkennbar bleibt. Unterschieden durch die petrolgrüne
       Farbe und eine Plakette mit weißem Plus.

       Bewusst kein rotes Kreuz auf weißem Grund: Das ist ein geschütztes
       Schutzzeichen und darf nicht verwendet werden. -->
  <rect width="512" height="512" rx="112" fill="#0f766e" />
  <rect x="116" y="96" width="280" height="320" rx="32" fill="#ffffff" />
  <path
    d="M 172 166 L 210 194 L 172 222"
    fill="none"
    stroke="#0f766e"
    stroke-width="26"
    stroke-linecap="round"
    stroke-linejoin="round"
  />
  <rect x="234" y="181" width="106" height="26" rx="13" fill="#0f766e" />
  <!-- Kürzere Zeilen als im Original: rechts unten sitzt die Plakette. -->
  <rect x="172" y="272" width="96" height="26" rx="13" fill="#bfe3de" />
  <rect x="172" y="330" width="72" height="26" rx="13" fill="#bfe3de" />
  <!-- Plakette mit Plus, ragt über die Ecke des Blatts. Der weiße Rand
       trennt sie von der gleichfarbigen Kachel. -->
  <circle cx="340" cy="352" r="66" fill="#0f766e" stroke="#ffffff" stroke-width="16" />
  <rect x="327" y="314" width="26" height="76" rx="7" fill="#ffffff" />
  <rect x="302" y="339" width="76" height="26" rx="7" fill="#ffffff" />
</svg>
